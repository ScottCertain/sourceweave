name: CI

# No model is invoked here. Generation runs locally on a workstation, under
# supervision, because it is rate-limited rather than metered -- see
# docs/decisions/0002-model-access-via-claude-subscription.md. CI checks the
# reviewed output that generation already committed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # No submodules. The site renders the corpus; it never reads
      # targets/*/upstream/ or targets/*/official-docs/ -- ADR 0006 forbids a
      # channel from reaching into them at all. Checking them out here would
      # clone ~93 MB of AnythingLLM source on every run to build a site that
      # does not open it.
      #
      # Actions clones fresh each run, with no persistent checkout cache, so
      # this is a per-run cost rather than a one-off. Netlify is separate: its
      # submodule checkout cannot be disabled (staff-confirmed; it runs before
      # any build script, so there is no workaround), and its real cost is
      # unmeasured. Do not go looking for a Netlify toggle -- there isn't one.
      #
      # If a job ever does need upstream, initialise that one path explicitly
      # rather than turning this back on:
      #   git submodule update --init targets/anythingllm/upstream
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # `docusaurus build` does not type-check. Without this step a type error
      # ships silently, which is the whole reason the site is TypeScript.
      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      # onBrokenLinks: 'throw' means a broken internal link fails here (FR-13).
      - name: Build
        working-directory: site
        run: npm run build

      # FR-22 is a requirement, not a config preference, so it is enforced
      # rather than trusted. `noIndex: true` in docusaurus.config.ts is one
      # line someone could flip without meaning to; this fails the build if
      # any rendered page loses its robots directive.
      - name: Verify noIndex on every page (FR-22)
        working-directory: site
        run: |
          total=$(find build -name '*.html' | wc -l)
          if [ "$total" -eq 0 ]; then
            echo "::error::No HTML produced by the build"
            exit 1
          fi
          missing=$(grep -riL 'noindex' --include='*.html' -r build || true)
          if [ -n "$missing" ]; then
            echo "::error::FR-22 violated -- pages rendered without a noindex directive:"
            echo "$missing"
            exit 1
          fi
          echo "FR-22 holds: noindex present on all $total page(s)."

      # FR-23 requires both statements on the site, not just in the README.
      # Checked the same way FR-22 is: a requirement that can be verified
      # mechanically should not depend on someone remembering it. Both strings
      # come from the non-closeable announcement bar and the footer, so losing
      # either one fails here rather than shipping quietly.
      - name: Verify unofficial and AI-generation notice (FR-23)
        working-directory: site
        run: |
          total=$(find build -name '*.html' | wc -l)
          fail=0
          for phrase in 'Independent and unofficial' 'automated pipeline'; do
            missing=$(grep -rLF "$phrase" --include='*.html' -r build || true)
            if [ -n "$missing" ]; then
              echo "::error::FR-23 violated -- pages missing \"$phrase\":"
              echo "$missing"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "FR-23 holds: unofficial statement and AI disclosure on all $total page(s)."

  prose:
    name: Lint prose
    runs-on: ubuntu-latest
    # Enable once style-guide/vale/ has rules (M3).
    if: false
    steps:
      - uses: actions/checkout@v6

      - name: Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          files: targets/
