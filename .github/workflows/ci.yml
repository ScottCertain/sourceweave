name: CI

# No model is invoked here. Generation runs locally on a workstation, under
# supervision, because it is rate-limited rather than metered -- see
# docs/decisions/0002-model-access-via-claude-subscription.md. CI checks the
# reviewed output that generation already committed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  site:
    name: Build site
    runs-on: ubuntu-latest
    # Enable once site/ is scaffolded (M0).
    if: false
    steps:
      - uses: actions/checkout@v6
        with:
          # Generated docs live outside site/, in targets/<name>/docs/, and
          # the build resolves them through the submodule checkout.
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

  prose:
    name: Lint prose
    runs-on: ubuntu-latest
    # Enable once style-guide/vale/ has rules (M3).
    if: false
    steps:
      - uses: actions/checkout@v6

      - name: Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          files: targets/
