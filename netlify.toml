# Netlify configuration.
#
# Committed rather than configured in the Netlify UI, for the same reason
# pipeline/claude-settings.json is pinned rather than inherited: build settings
# that live only in a dashboard are invisible in review, absent from history,
# and impossible to reproduce from a commit (NFR-2).
#
# No secrets here, and none ever (NFR-1). Anything sensitive belongs in Netlify
# environment variables.

[build]
  # Paths are relative to the repository root; `publish` is relative to `base`,
  # so this resolves to site/build.
  base    = "site"
  command = "npm run build"
  publish = "build"

  # Widen the change detection past `base`.
  #
  # By default Netlify skips a build entirely when nothing under `base` has
  # changed -- "No changes detected in base directory. Returning early from
  # build." That is correct for most sites and wrong for this one: the corpus
  # lives in targets/<name>/docs/, outside base, and site/docs/ is derived and
  # gitignored (ADR 0008). So publishing a reviewed page changes nothing
  # Netlify watches. It would merge and never appear, with no error anywhere.
  #
  # Exit 0 skips the build; any non-zero exit builds. Every failure path here
  # is non-zero: an empty CACHED_COMMIT_REF on a first build exits 128, and a
  # malformed range exits non-zero too. The worst case is a needless
  # twenty-second build. There is no path that silently skips.
  #
  # CACHED_COMMIT_REF is the last successfully built commit, not HEAD^, so a
  # push containing several commits is compared as a whole.
  #
  # netlify.toml is in the watched set because changing the headers or
  # redirects here must reach the edge.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ targets/ netlify.toml"

[build.environment]
  # Matches the Node version CI builds with, so a build that passes in CI is
  # not the first to fail here. site/package.json requires >=20.0.
  NODE_VERSION = "20"

# FR-22, defence in depth.
#
# docusaurus.config.ts emits <meta name="robots" content="noindex, nofollow">
# into every page and CI fails the build if any page loses it. This header does
# the same job one layer lower, and covers what the meta tag cannot: non-HTML
# assets, and any crawler that reads headers without parsing the document.
#
# It applies to every deploy context, which matters most for deploy previews --
# those get public URLs on every pull request, and they should not be indexable
# either.
#
# Removing this is part of the same deliberate decision as removing noIndex,
# once the metrics in PRD section 10 reach threshold. Both come off together or
# the site is half-indexed.
[[headers]]
  for = "/*"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# One canonical host.
#
# sourceweave.scottcertain.com is set as the primary domain in the Netlify UI,
# which is documented to redirect the Netlify-assigned subdomain to it. It was
# observed not doing so -- sourceweave.netlify.app kept returning 200 after the
# setting was applied and after a subsequent deploy. Rather than depend on a
# dashboard setting whose effect could not be verified, the redirect is stated
# here, where it is reviewable and reproducible from a commit.
#
# `force = true` is required: without it a redirect yields to an existing file,
# and every path on this site has one.
#
# The `from` names the production host exactly, which is the point. A pattern
# like *.netlify.app would also capture deploy previews
# (deploy-preview-42--sourceweave.netlify.app) and branch deploys, sending
# every preview to production and making them useless for review.
#
# Until FR-22 is lifted this changes nothing a crawler can see -- both hosts
# are noindex, and both already emit a canonical pointing here. It matters on
# the day noIndex comes off, which is exactly when nobody will be thinking
# about it.
[[redirects]]
  from = "https://sourceweave.netlify.app/*"
  to = "https://sourceweave.scottcertain.com/:splat"
  status = 301
  force = true
