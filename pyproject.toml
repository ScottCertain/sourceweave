[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourceweave"
version = "0.1.0"
description = "Generation-focused documentation system: generate, evaluate, publish."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Scott Certain" }]

# Deliberately no anthropic SDK dependency. Model access goes through the
# Claude Code CLI on a subscription -- see
# docs/decisions/0002-model-access-via-claude-subscription.md
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sourceweave = "sourceweave_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "pipeline/sourceweave_pipeline",
    "eval/sourceweave_eval",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The upstream submodules are third-party source, read-only by a CLAUDE.md
# hard rule. Without this, `ruff check .` reports errors in code we do not own
# and cannot fix -- and `ruff format .`, which CLAUDE.md documents as a
# standard command, would rewrite files inside a read-only submodule.
#
# It also keeps local and CI behaviour identical. CI checks out without
# submodules, so it lints an empty directory and passes; a contributor with
# the submodule initialised would see failures CI never shows.
extend-exclude = [
    "targets/*/upstream",
    "targets/*/official-docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "eval/tests"]
